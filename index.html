<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="PFD Protocols — private Phoenix Fire Department EMS protocol reference for paramedics.">
<title>PFD Protocols</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- GATE VIEW: this is the ONLY thing visitors ever see before unlocking.
     No protocol content exists in this bundle — only an encrypted blob
     (protocols.enc.json) that is unreadable without the access code. -->
<section id="view-gate" class="view">
  <div class="signin-card">
    <div class="brand"><span class="brand-cross">✚</span> PFD Protocols</div>
    <p class="tagline">Phoenix Fire Department EMS protocol reference.<br>Authorized medics only.</p>
    <form id="gate-form" autocomplete="off">
      <label class="field"><span>Access code</span>
        <input id="gate-code" type="password" required autocomplete="off"
               autocapitalize="off" spellcheck="false" placeholder="Enter access code">
      </label>
      <p id="gate-error" class="form-error" hidden></p>
      <button class="btn primary big" type="submit">Unlock</button>
    </form>
    <p class="fine">Need the code? Ask your department admin.</p>
    <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode">◐</button>
  </div>
</section>

<!-- APP -->
<section id="view-app" class="view" hidden>
  <header class="topbar">
    <div class="brand small"><span class="brand-cross">✚</span> PFD Protocols</div>
    <div class="topbar-actions">
      <button id="theme-toggle2" class="icon-btn" aria-label="Toggle dark mode">◐</button>
      <button id="lock-btn" class="icon-btn" aria-label="Lock app">🔒</button>
    </div>
  </header>
  <div class="search-wrap">
    <input id="search" type="search" autocomplete="off" placeholder="Search protocols, drugs, procedures…" aria-label="Search protocols">
  </div>
  <div id="chips" class="chips" role="tablist" aria-label="Categories"></div>
  <p id="result-count" class="result-count"></p>
  <main id="results" class="results"></main>
  <footer class="foot">For PFD personnel only. In any conflict, on-line medical direction (OLMD) prevails.</footer>
</section>

<!-- FOCUS MODE: one protocol, full screen, everything else hidden -->
<div id="focus" class="focus" hidden role="dialog" aria-modal="true" aria-label="Protocol">
  <div class="focus-bar">
    <button id="focus-prev" class="btn secondary" hidden>← Previous</button>
    <button id="focus-back" class="btn primary big">← Back to search</button>
  </div>
  <article id="focus-body" class="focus-body"></article>
  <div class="focus-bar bottom">
    <button id="focus-back2" class="btn primary big">← Back to search</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
